[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "false-friend-lab"
version = "0.1.0"
description = "Controlled experiments on cross-lingual lexical sharing, prediction, and semantic interference"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
