name: Temporary knowledge audit snapshot
on:
  push:
    branches: [research/knowledge-foundation-2026-10-12]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate deterministic browseable assets
        run: python scripts/build_knowledge_index.py
      - name: Snapshot tracked files and generated index only
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          files += ['knowledge/PAPERS_INDEX.md','knowledge/catalogue/SOURCE_CARDS.md']
          with zipfile.ZipFile('/tmp/false-friend-tracked.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(set(files)):
                  if name and pathlib.Path(name).is_file():
                      z.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: false-friend-tracked-snapshot
          path: /tmp/false-friend-tracked.zip
          retention-days: 7
      - name: Record generated navigation files only on isolated audit branch
        run: |
          test "$GITHUB_REF" = "refs/heads/research/knowledge-foundation-2026-10-12"
          git add knowledge/PAPERS_INDEX.md knowledge/catalogue/SOURCE_CARDS.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate workbench paper index and bounded source cards from canonical registry'
          git push origin HEAD:refs/heads/research/knowledge-foundation-2026-10-12
