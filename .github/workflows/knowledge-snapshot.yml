name: Temporary knowledge audit snapshot
on:
  push:
    branches: [research/knowledge-foundation-2026-10-12]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot tracked files only (no git credentials or environment)
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('/tmp/false-friend-tracked.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  if name and pathlib.Path(name).is_file():
                      z.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: false-friend-tracked-snapshot
          path: /tmp/false-friend-tracked.zip
          retention-days: 7
