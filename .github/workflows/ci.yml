name: Unit tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
      - name: Research knowledge integrity
        run: python scripts/check_knowledge.py
      - name: Illustrative data preflight
        run: python scripts/preflight.py --data data/examples/illustrative.jsonl --allow-illustrative
