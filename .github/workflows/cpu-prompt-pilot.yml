name: CPU-only exploratory Tanwar prompt-order smoke

on:
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only pilot dependencies
        run: |
          python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.57.1" "huggingface_hub>=0.34.0,<1" safetensors
      - name: Get exact published Task3 source
        run: |
          git clone --quiet https://github.com/EshaanT/Bilingual_processing_LLMs.git /tmp/tanwar
          git -C /tmp/tanwar checkout --quiet 281a67eac6ddbe5445e1c10277e5833d40d72125
      - name: Dry run instrument
        run: |
          python scripts/pilot_tanwar_prompt_order.py \
            --source-tsv /tmp/tanwar/data/task3_en_de.csv --l2 de \
            --limit 1 --strength high \
            --variants original,meaning_first,meaning_only \
            --output outputs/prompt_manifest.jsonl --dry-run
      - name: Open-weight Qwen 0.5B CPU exploratory generation
        run: |
          python scripts/pilot_tanwar_prompt_order.py \
            --source-tsv /tmp/tanwar/data/task3_en_de.csv --l2 de \
            --limit 1 --strength high \
            --variants original,meaning_first,meaning_only \
            --model-id Qwen/Qwen2.5-0.5B-Instruct --model-revision main \
            --max-new-tokens 80 \
            --output outputs/very_small_cpu_pilot.jsonl
      - name: Balanced gloss pilot on three source adjectives — Qwen2.5-1.5B CPU
        run: |
          python scripts/pilot_tanwar_gloss_margins.py \
            --context-tsv /tmp/tanwar/data/task3_en_de.csv \
            --lexicon-csv /tmp/tanwar/data/en_de_dataset.csv \
            --ids 261,264,272 --strengths high --cues none,q1_host,q1_other \
            --model-id Qwen/Qwen2.5-1.5B-Instruct \
            --output outputs/adjective_gloss_margins.jsonl
      - name: Report paired A/B answer-order measurement instability
        run: |
          python scripts/analyze_gloss_order_bias.py \
            --input outputs/adjective_gloss_margins.jsonl \
            --output outputs/adjective_label_order_diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unreviewed-tanwar-prompt-order-smoke
          path: outputs/
          retention-days: 30
