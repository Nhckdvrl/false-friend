experiment:
  name: gate1_form_context_causal
  output_root: runs/gate1_fast

data:
  processed_dir: data/processed/en_de
model:
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.0
train:
  schedule: joint
  max_updates: 8000
  micro_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 0.0005
  warmup_updates: 500
  lr_schedule: cosine
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  mixed_precision: bf16
  gradient_checkpointing: false
  log_every: 50
  save_every_updates: 1000
