experiment:
  name: gate1_form_context_causal_full
  output_root: runs/gate1_full
data:
  processed_dir: data/processed/en_de
model:
  block_size: 512
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
train:
  schedule: joint
  max_updates: 30000
  micro_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 0.0003
  lr_schedule: cosine
  warmup_updates: 1000
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  mixed_precision: bf16
  gradient_checkpointing: true
  log_every_updates: 50
  save_every_updates: 2500
