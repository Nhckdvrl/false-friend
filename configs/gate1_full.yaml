experiment:
  name: gate1_form_meaning_causal_full
  output_root: runs/gate1_full

data:
  processed_dir: data/processed/en_de

model:
  block_size: 512
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0

train:
  schedule: joint
  max_steps: 30000
  per_device_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 0.0003
  warmup_steps: 1000
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  mixed_precision: bf16
  gradient_checkpointing: true
  log_every: 50
  save_every: 2500
  phase_steps: 10000
  balanced_tail_steps: 20000
