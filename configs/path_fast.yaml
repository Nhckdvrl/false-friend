experiment:
  name: gate3_path_dependence_fast
  output_root: runs/path_fast

data:
  processed_dir: data/processed/en_de
model:
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.0
train:
  schedule: en_then_de
  phase_updates: 4000
  balanced_tail_updates: 8000
  max_updates: 16000
  micro_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 0.0005
  warmup_updates: 0
  lr_schedule: constant
  reset_optimizer_at_balanced_tail: true
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  mixed_precision: bf16
  gradient_checkpointing: false
  log_every: 50
  save_every_updates: 1000
