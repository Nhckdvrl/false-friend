experiment:
  name: smoke_runtime
  output_root: runs/smoke

data:
  processed_dir: data/processed/en_de
model:
  block_size: 128
  n_layer: 2
  n_head: 4
  n_embd: 128
  dropout: 0.0
train:
  schedule: joint
  max_steps: 50
  per_device_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 0.001
  warmup_steps: 5
  weight_decay: 0.0
  betas: [0.9, 0.95]
  grad_clip: 1.0
  mixed_precision: bf16
  gradient_checkpointing: false
  log_every: 10
  save_every: 50
  phase_steps: 25
  balanced_tail_steps: 50
